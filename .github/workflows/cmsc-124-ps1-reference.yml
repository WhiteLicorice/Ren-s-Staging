# This workflow replaces the starter modules with the instructor reference.
# It then runs the published check.sh and requires a successful result.
#
# The starter workflow fails 30 of 63 checks because its modules are incomplete.
# This workflow holds the solution and verifies assignment completion.
#
# The suite runs in the public repository WhiteLicorice/Ren-s-Staging, so it
# spends no private Actions minutes. It checks out the private materials
# repository with a read-only deploy key.
name: cmsc-124-ps1-reference

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch of WhiteLicorice/Ren-s-Materials to test'
        required: false
        default: master
        type: string
  schedule:
    # Run each Sunday. check.sh fetches the harness from its pinned URL.
    # This schedule detects an unavailable URL without a repository change.
    - cron: '17 20 * * 0'

permissions:
  contents: read

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      # Fetch only the starter submodule.
      - name: Fetch the pinned starter
        run: git -C materials submodule update --init -- "CMSC 124/Lecture/ps-data-types/starter"

      - name: Say which starter version is under test
        run: git -C "materials/CMSC 124/Lecture/ps-data-types/starter" describe --tags --always

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The manual's Windows route is MSYS2, not Git Bash. It prints the WinGet
      # line, then the two pacman lines, and then every later command in the
      # MSYS2 UCRT64 terminal. The plain MSYS2 shell and Git Bash both carry a
      # different compiler, so the UCRT64 environment is the one that counts.
      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'C:\msys64\usr\bin\bash.exe') {
            Write-Output 'MSYS2 is already at C:\msys64'
          } else {
            winget install --id MSYS2.MSYS2 --exact --accept-package-agreements --accept-source-agreements
          }
          # The WinGet installer exits 1 on a runner that already carries part of
          # MSYS2. The official installer runs unattended with /S.
          if (-not (Test-Path 'C:\msys64\usr\bin\bash.exe')) {
            Write-Output 'WinGet did not leave MSYS2 at C:\msys64. Using the official installer.'
            curl.exe -sSL -o "$env:RUNNER_TEMP\msys2.exe" https://github.com/msys2/msys2-installer/releases/latest/download/msys2-x86_64-latest.exe
            Start-Process -FilePath "$env:RUNNER_TEMP\msys2.exe" -Wait -ArgumentList '/S'
          }
          if (-not (Test-Path 'C:\msys64\usr\bin\bash.exe')) { throw 'MSYS2 is not at C:\msys64' }

      - name: Install the UCRT64 toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MSYSTEM = 'UCRT64'
          $env:CHERE_INVOKING = '1'
          # The manual warns that the first pacman -Syu may ask for the terminal
          # to be closed and reopened. Each call below is a new shell, so the
          # second call finishes the upgrade.
          C:\msys64\usr\bin\bash.exe -lc 'pacman -Syu --noconfirm || true'
          C:\msys64\usr\bin\bash.exe -lc 'pacman -Syu --noconfirm'
          C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm git curl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python'
          C:\msys64\usr\bin\bash.exe -lc 'gcc --version | head -1; cmake --version | head -1; ninja --version; python3 --version'

      # verify.sh copies the starter and inserts the reference source files.
      # It runs the starter's published check.sh against that copy.
      - name: Run the published checks with the solution overlaid
        if: runner.os != 'Windows'
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 124/Lecture/ps-data-types/reference/verify.sh"

      # The same check, in the MSYS2 UCRT64 shell the manual sends a Windows
      # student into. The sanitized leg reports a skip here, because MinGW ships
      # no libasan. The manual says so and check.sh handles it.
      - name: Run the published checks with the solution overlaid (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MSYSTEM = 'UCRT64'
          $env:CHERE_INVOKING = '1'
          C:\msys64\usr\bin\bash.exe -lc 'temp="$(cygpath -u "$RUNNER_TEMP")"; exec >> "$temp/full-output.txt" 2>&1; bash "materials/CMSC 124/Lecture/ps-data-types/reference/verify.sh"'
          exit $LASTEXITCODE

      - name: Report the result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_REF: ${{ inputs.ref || 'master' }}
          JOB_NAME: ${{ github.job }}
          MATRIX_ENTRY: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/full-output.txt"

          # The public log prints the case names and the pass or fail results.
          # The full output stays in the file and goes to the private issue.
          if [ -f "$full" ]; then
            grep -E '^\[(PASS|FAIL)\]|^[0-9]+/[0-9]+ |^result: |^KTEST VERDICT |^  (ok|fail|warn) |^checks: |^(PASS|FAIL) |^All published checks passed|^verify\.sh: |^self-tests: pass|^shared files: in sync|^no QEMU process is left|^starter .* ok|^exported |^verify: PASS|^Lab [0-9] count|^All Lab [0-9] checks passed|^Group Lab|^[0-9]+ of [0-9]+ steps complete|^Some checks in cases failed|^the reference state imported|^CMSC197_' "$full" || true
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          case "$JOB_STATUS" in
            success|failure) ;;
            *) echo "Job status $JOB_STATUS. The issue report is skipped."; exit 0 ;;
          esac

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          body="$RUNNER_TEMP/issue-body.txt"
          {
            printf 'Run: %s\n' "$RUN_URL"
            printf 'Tested ref: %s\n' "$TESTED_REF"
            printf 'Job: %s\n' "$JOB_NAME"
            printf 'Matrix: %s\n' "$MATRIX_ENTRY"
            printf '\n'
          } > "$body"
          budget=$(( 60000 - $(wc -c < "$body") ))
          if [ -f "$full" ]; then
            tail -c "$budget" "$full" >> "$body"
          fi

          numbers="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number")"
          number="$(printf '%s\n' "$numbers" | sed -n '1p')"

          if [ "$JOB_STATUS" = "success" ]; then
            if [ -z "$number" ]; then
              echo "No open issue to close."
              exit 0
            fi
            # A passing job must not close an issue that a failing job of the same run
            # opened. The failure text names the run URL, in the body of a new issue or
            # in a comment on an open one.
            body_text="$(gh api "repos/$repo/issues/$number" --jq '.body')"
            case "$body_text" in
              *"$RUN_URL"*)
                echo "Another job of this run failed. The issue stays open."
                exit 0
                ;;
            esac
            comments="$(gh api --paginate "repos/$repo/issues/$number/comments?per_page=100" --jq '.[].body')"
            case "$comments" in
              *"$RUN_URL"*)
                echo "Another job of this run failed. The issue stays open."
                exit 0
                ;;
            esac
            gh issue close "$number" -R "$repo" --comment "Passing run: $RUN_URL"
            exit 0
          fi

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$repo" --body-file "$body"
            # A passing job of this run may have closed the issue between the lookup and
            # the comment. A failure must leave the issue open.
            state="$(gh api "repos/$repo/issues/$number" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$number" -R "$repo"
            fi
          else
            gh issue create -R "$repo" --title "$title" --body-file "$body"
          fi

