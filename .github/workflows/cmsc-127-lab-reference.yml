name: cmsc-127-lab-reference

# The suite runs in the public repository WhiteLicorice/Ren-s-Staging, so it
# spends no private Actions minutes. It checks out the private materials
# repository with a read-only deploy key.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch of WhiteLicorice/Ren-s-Materials to test'
        required: false
        default: master
        type: string

permissions:
  contents: read

# One run of this suite at a time. An older run ends before a newer one
# starts, so an older run cannot close an issue that a newer run opened. A
# second pending run replaces the older pending one.
concurrency:
  group: cmsc-127-lab-reference
  cancel-in-progress: false

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PG_VERSION: '18'

    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch the harness and starter submodules
        run: |
          set -euo pipefail
          git -C materials submodule update --init -- \
            "CMSC 127/Laboratory/harness" \
            "CMSC 127/Laboratory/starter"

      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install the harness Python requirements
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/materials/CMSC 127/Laboratory/harness"
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r "$harness/requirements.txt"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install PostgreSQL 18 on Ubuntu
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --retry 3 --retry-all-errors -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: $(dpkg --print-architecture)
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y "postgresql-${PG_VERSION}"

          if ! sudo pg_lsclusters -h | grep -q "^${PG_VERSION} main "; then
            sudo pg_createcluster "${PG_VERSION}" main
          fi
          sudo pg_ctlcluster "${PG_VERSION}" main stop || true
          sudo tee -a "/etc/postgresql/${PG_VERSION}/main/postgresql.conf" >/dev/null <<'PGCONF'
          listen_addresses = '127.0.0.1'
          PGCONF
          if ! sudo pg_ctlcluster "${PG_VERSION}" main start; then
            sudo tail -n 80 "/var/log/postgresql/postgresql-${PG_VERSION}-main.log" || true
            exit 1
          fi

          pg_bin="/usr/lib/postgresql/${PG_VERSION}/bin"
          pg_port="$(sudo pg_lsclusters -h | awk -v version="$PG_VERSION" '$1 == version && $2 == "main" { print $3 }')"
          test -n "$pg_port"
          sudo -u postgres psql -p "$pg_port" -c "ALTER ROLE postgres PASSWORD 'password';"
          echo "$pg_bin" >> "$GITHUB_PATH"
          printf 'PG_BIN=%s\nPGHOST=127.0.0.1\nPGPORT=%s\nPGUSER=postgres\nPGPASSWORD=password\nCMSC127_DATABASE_URL=postgresql://postgres:password@127.0.0.1:%s/postgres\n' \
            "$pg_bin" "$pg_port" "$pg_port" >> "$GITHUB_ENV"
          export PATH="$pg_bin:$PATH" PGPASSWORD=password
          for _ in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p "$pg_port" && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p "$pg_port"
          psql -h 127.0.0.1 -p "$pg_port" -U postgres -d postgres -c 'SELECT version();'

      - name: Install PostgreSQL 18 on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install "postgresql@${PG_VERSION}"
          pg_bin="$(brew --prefix "postgresql@${PG_VERSION}")/bin"
          pg_data="$(brew --prefix)/var/postgresql@${PG_VERSION}"
          pg_user="$(whoami)"
          brew services stop "postgresql@${PG_VERSION}" >/dev/null 2>&1 || true
          if [[ ! -s "$pg_data/PG_VERSION" ]]; then
            mkdir -p "$(dirname "$pg_data")"
            "$pg_bin/initdb" -D "$pg_data" -U "$pg_user" --auth-local=trust --auth-host=scram-sha-256
          fi
          printf "\nlisten_addresses = '127.0.0.1'\n" >> "$pg_data/postgresql.conf"
          brew services start "postgresql@${PG_VERSION}"

          export PATH="$pg_bin:$PATH" PGPASSWORD=password
          for _ in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5432 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432
          psql -U "$pg_user" -d postgres -c "ALTER ROLE \"$pg_user\" PASSWORD 'password';"
          echo "$pg_bin" >> "$GITHUB_PATH"
          printf 'PG_BIN=%s\nPGHOST=127.0.0.1\nPGPORT=5432\nPGUSER=%s\nPGPASSWORD=password\nCMSC127_DATABASE_URL=postgresql://%s:password@127.0.0.1:5432/postgres\n' \
            "$pg_bin" "$pg_user" "$pg_user" >> "$GITHUB_ENV"
          psql -h 127.0.0.1 -p 5432 -U "$pg_user" -d postgres -c 'SELECT version();'

      - name: Run the Lab 1 reference verifier
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 127/Laboratory/lab1/reference/verify.sh"

      - name: Run the Lab 2 reference verifier
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 127/Laboratory/lab2/reference/verify.sh"

      - name: Run the Lab 3 reference verifier
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 127/Laboratory/lab3/reference/verify.sh"

      - name: Report a failure
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_REF: ${{ inputs.ref || 'master' }}
          JOB_NAME: ${{ github.job }}
          MATRIX_ENTRY: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/full-output.txt"

          # The public log prints the case names and the pass or fail results.
          # The full output stays in the file and goes to the private issue.
          if [ -f "$full" ]; then
            grep -E '^\[(PASS|FAIL)\]|^[0-9]+/[0-9]+ |^result: |^KTEST VERDICT |^  (ok|fail|warn) |^checks: |^(PASS|FAIL) |^All published checks passed|^verify\.sh: |^self-tests: pass|^shared files: in sync|^no QEMU process is left|^starter .* ok|^exported |^verify: PASS|^Lab [0-9] count|^All Lab [0-9] checks passed|^Group Lab|^[0-9]+ of [0-9]+ steps complete|^Some checks in cases failed|^the reference state imported|^CMSC197_' "$full" || true
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # Only a failure reports. The closing job at the end of this workflow
          # closes the issue, and that job waits for every other job.
          case "$JOB_STATUS" in
            failure) ;;
            *)
              echo "Job status $JOB_STATUS. This job reports no failure."
              exit 0
              ;;
          esac

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          body="$RUNNER_TEMP/issue-body.txt"
          {
            printf 'Run: %s\n' "$RUN_URL"
            printf 'Tested ref: %s\n' "$TESTED_REF"
            printf 'Job: %s\n' "$JOB_NAME"
            printf 'Matrix: %s\n' "$MATRIX_ENTRY"
            printf '\n'
          } > "$body"
          budget=$(( 60000 - $(wc -c < "$body") ))
          if [ -f "$full" ]; then
            tail -c "$budget" "$full" >> "$body"
          fi

          numbers="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number")"
          number="$(printf '%s\n' "$numbers" | sed -n '1p')"

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$repo" --body-file "$body"
            # The closing job of a run that started after this one may have
            # closed the issue between the lookup and the comment. A failure
            # must leave the issue open.
            state="$(gh api "repos/$repo/issues/$number" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$number" -R "$repo"
            fi
            exit 0
          fi

          # Two jobs of one run can fail at the same moment. Both find no open
          # issue and both create one, so the later one folds its report into
          # the lowest-numbered issue and closes the issue it created.
          created="$(gh issue create -R "$repo" --title "$title" --body-file "$body")"
          created="${created##*/}"
          keep="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sort -n | sed -n '1p')"
          if [ -n "$keep" ] && [ "$keep" != "$created" ]; then
            gh issue comment "$keep" -R "$repo" --body-file "$body"
            # A closing job may have closed the kept issue in the same
            # moment. The failure must leave it open.
            state="$(gh api "repos/$repo/issues/$keep" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$keep" -R "$repo"
            fi
            gh issue close "$created" -R "$repo" \
              --comment "Duplicate of #$keep for the same run." || true
          fi


  # The manual's Windows route. Every tool comes from its own Windows
  # installer, and every Bash command runs in Git Bash, as the b1 manual
  # prints. The three lab verifiers are the same files the other job runs.
  reference-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PG_VERSION: '18'
      PYTHON_VERSION: 3.15.2
      PYTHON_EXE: python-3.15.2-amd64.exe
      PG_INSTALLER: postgresql-18.7-1-windows-x64.exe

    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch the harness and starter submodules
        run: |
          set -euo pipefail
          git -C materials submodule update --init -- \
            "CMSC 127/Laboratory/harness" \
            "CMSC 127/Laboratory/starter"

      - name: Record the runner
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          printf 'image=%s version=%s\n' "$ImageOS" "$ImageVersion"
          cmd //c ver
          git --version

      # The b1 manual installs Python's own install manager, then asks it for
      # the 3.15 runtime. The Store package route needs the Store service, which
      # a hosted runner may not run, so a failure here falls back to the
      # python.org 3.15.2 installer for the same version.
      - name: Install Python 3.15.2
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          powershell -NoProfile -Command \
            "Add-AppxPackage -AppInstallerFile https://www.python.org/ftp/python/pymanager/pymanager.appinstaller" \
            || echo "pymanager appinstaller failed"
          py -3.15 --version || true
          if ! py -3.15 --version 2>/dev/null | grep -q "^Python ${PYTHON_VERSION}$"; then
            echo "pymanager did not provide 3.15.2. Using the python.org installer."
            curl --fail --location --retry 3 \
              "https://www.python.org/ftp/python/${PYTHON_VERSION}/${PYTHON_EXE}" \
              -o "$RUNNER_TEMP/$PYTHON_EXE"
            powershell -NoProfile -Command \
              "Start-Process -FilePath '$RUNNER_TEMP/$PYTHON_EXE' -Wait -ArgumentList '/quiet','InstallAllUsers=1','PrependPath=1','Include_test=0'"
          fi
          py -3.15 --version
          py -3.15 --version | grep -q "^Python ${PYTHON_VERSION}$"

      # The b1 manual prints this installer, this port, and this role. Part 5.1
      # also asks for the Visual C++ v14 runtime, which the server needs before
      # it starts.
      - name: Install PostgreSQL 18
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          curl --fail --location --retry 3 \
            "https://get.enterprisedb.com/postgresql/${PG_INSTALLER}" \
            -o "$RUNNER_TEMP/$PG_INSTALLER"
          powershell -NoProfile -Command \
            "Start-Process -FilePath '$RUNNER_TEMP/$PG_INSTALLER' -Wait -ArgumentList '--mode','unattended','--unattendedmodeui','none','--serverport','5432','--enable-components','server,commandlinetools','--disable-components','pgAdmin,stackbuilder','--superpassword','password'"
          powershell -NoProfile -Command \
            "if ((Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64' -ErrorAction SilentlyContinue).Installed -ne 1) { curl.exe -sSL -o \"\$env:RUNNER_TEMP\vc_redist.x64.exe\" https://aka.ms/vc14/vc_redist.x64.exe; Start-Process -FilePath \"\$env:RUNNER_TEMP\vc_redist.x64.exe\" -Wait -ArgumentList '/quiet','/norestart' }"
          powershell -NoProfile -Command "Get-Service postgresql-x64-${PG_VERSION} | Format-List Name,Status,StartType"
          export PATH="/c/Program Files/PostgreSQL/${PG_VERSION}/bin:$PATH"
          for _ in $(seq 1 60); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 2; done
          pg_isready -h 127.0.0.1 -p 5432
          PGPASSWORD=password psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c 'SELECT version();'
          printf 'PG_BIN=C:\\Program Files\\PostgreSQL\\%s\\bin\n' "${PG_VERSION}" >> "$GITHUB_ENV"
          printf 'PATH=C:\\Program Files\\PostgreSQL\\%s\\bin;%s\n' "${PG_VERSION}" "$PATH" >> "$GITHUB_ENV"
          printf 'PGHOST=127.0.0.1\nPGPORT=5432\nPGUSER=postgres\nPGPASSWORD=password\nCMSC127_DATABASE_URL=postgresql://postgres:password@127.0.0.1:5432/postgres\n' >> "$GITHUB_ENV"

      - name: Install the harness Python requirements
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          harness="$GITHUB_WORKSPACE/materials/CMSC 127/Laboratory/harness"
          py -3.15 -m venv .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -r "$harness/requirements.txt"
          printf '%s\n' "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          .venv/Scripts/python.exe --version
          .venv/Scripts/python.exe -c 'import psycopg; print("psycopg", psycopg.__version__)'

      - name: Run the Lab 1 reference verifier
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 127/Laboratory/lab1/reference/verify.sh"

      - name: Run the Lab 2 reference verifier
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 127/Laboratory/lab2/reference/verify.sh"

      - name: Run the Lab 3 reference verifier
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 127/Laboratory/lab3/reference/verify.sh"

      - name: Report a failure
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_REF: ${{ inputs.ref || 'master' }}
          JOB_NAME: ${{ github.job }}
          MATRIX_ENTRY: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/full-output.txt"

          # The public log prints the case names and the pass or fail results.
          # The full output stays in the file and goes to the private issue.
          if [ -f "$full" ]; then
            grep -E '^\[(PASS|FAIL)\]|^[0-9]+/[0-9]+ |^result: |^KTEST VERDICT |^  (ok|fail|warn) |^checks: |^(PASS|FAIL) |^All published checks passed|^verify\.sh: |^self-tests: pass|^shared files: in sync|^no QEMU process is left|^starter .* ok|^exported |^verify: PASS|^Lab [0-9] count|^All Lab [0-9] checks passed|^Group Lab|^[0-9]+ of [0-9]+ steps complete|^Some checks in cases failed|^the reference state imported|^CMSC197_' "$full" || true
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # Only a failure reports. The closing job at the end of this workflow
          # closes the issue, and that job waits for every other job.
          case "$JOB_STATUS" in
            failure) ;;
            *)
              echo "Job status $JOB_STATUS. This job reports no failure."
              exit 0
              ;;
          esac

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          body="$RUNNER_TEMP/issue-body.txt"
          {
            printf 'Run: %s\n' "$RUN_URL"
            printf 'Tested ref: %s\n' "$TESTED_REF"
            printf 'Job: %s\n' "$JOB_NAME"
            printf 'Matrix: %s\n' "$MATRIX_ENTRY"
            printf '\n'
          } > "$body"
          budget=$(( 60000 - $(wc -c < "$body") ))
          if [ -f "$full" ]; then
            tail -c "$budget" "$full" >> "$body"
          fi

          numbers="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number")"
          number="$(printf '%s\n' "$numbers" | sed -n '1p')"

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$repo" --body-file "$body"
            # The closing job of a run that started after this one may have
            # closed the issue between the lookup and the comment. A failure
            # must leave the issue open.
            state="$(gh api "repos/$repo/issues/$number" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$number" -R "$repo"
            fi
            exit 0
          fi

          # Two jobs of one run can fail at the same moment. Both find no open
          # issue and both create one, so the later one folds its report into
          # the lowest-numbered issue and closes the issue it created.
          created="$(gh issue create -R "$repo" --title "$title" --body-file "$body")"
          created="${created##*/}"
          keep="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sort -n | sed -n '1p')"
          if [ -n "$keep" ] && [ "$keep" != "$created" ]; then
            gh issue comment "$keep" -R "$repo" --body-file "$body"
            # A closing job may have closed the kept issue in the same
            # moment. The failure must leave it open.
            state="$(gh api "repos/$repo/issues/$keep" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$keep" -R "$repo"
            fi
            gh issue close "$created" -R "$repo" \
              --comment "Duplicate of #$keep for the same run." || true
          fi

  # Every job above reports its own failure. This job closes the issue, because
  # a passing job alone does not mean the run passed: a job that fails later
  # would open the issue again. It closes only when every job succeeded or was
  # skipped. A cancelled job is not a pass, so a cancelled run closes nothing.
  report:
    needs: [reference, reference-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Close the issue when every job passed
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # A skipped job is fine. Every other result, including a cancelled
          # job, keeps the issue open.
          verdict="$(printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          results = [job["result"] for job in json.load(sys.stdin).values()]
          print("pass" if all(r in ("success", "skipped") for r in results) else "hold")
          ')"
          if [ "$verdict" != "pass" ]; then
            echo "A job did not pass. The issue stays open."
            exit 0
          fi

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          number="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sed -n '1p')"
          if [ -z "$number" ]; then
            echo "No open issue to close."
            exit 0
          fi

          # A newer run may have opened this issue. It names its run in the
          # body or in a comment. Close the issue only when the newest run it
          # names is this run or an older one, so an older run cannot report a
          # pass over a newer failure.
          body_text="$(gh api "repos/$repo/issues/$number" --jq '.body')"
          comments="$(gh api --paginate "repos/$repo/issues/$number/comments?per_page=100" --jq '.[].body')"
          newest="$(printf '%s\n%s\n' "$body_text" "$comments" \
            | grep -oE "github\.com/$GITHUB_REPOSITORY/actions/runs/[0-9]+" \
            | sed -n 's|.*/||p' | sort -n | tail -1 || true)"
          if [ -z "$newest" ]; then
            echo "The issue names no run. The issue stays open."
            exit 0
          fi
          if [ "$newest" -gt "$RUN_ID" ]; then
            echo "Run $newest is newer than this run $RUN_ID. The issue stays open."
            exit 0
          fi
          gh issue close "$number" -R "$repo" --comment "Passing run: $RUN_URL"
