name: poll

# Every suite runs when a path it covers changes. This workflow is what makes
# that happen. Once an hour it reads the Ren-s-Materials head with the deploy
# key and dispatches only the suites whose paths changed since the head they
# last passed on.
#
# The last tested head is kept in this repository's own run history. A suite's
# watermark is the start time of its newest run that is not a failure. A queued
# or running suite counts, so a second poll does not dispatch it again. A
# failed suite does not count, so the next poll tries it again.
on:
  schedule:
    # Minute 17 is not 0 and not 30, so this run does not start with the
    # hourly crowd.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two polls must not dispatch the same suite twice. A pending run replaces an
# older pending one, so only the newest queued poll survives. A running poll is
# not cancelled.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      # `actions: write` dispatches the suites. `contents: read` lets the
      # checkout below read this repository's own history.
      actions: write
      contents: read
    steps:
      # A suite also covers its own workflow file, and that file lives here, not
      # in the materials repository. The full history is small, and the loop
      # below reads it to see whether a workflow file changed since the suite
      # last ran.
      - name: Check out this repository's own history
        uses: actions/checkout@v7
        with:
          path: staging
          fetch-depth: 0
          persist-credentials: false

      - name: Dispatch the suites whose paths changed
        env:
          GH_TOKEN: ${{ github.token }}
          MATERIALS_DEPLOY_KEY: ${{ secrets.MATERIALS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # The key goes to a file that only this user can read. Nothing prints
          # it, and nothing prints the checkout's .git config.
          key="$RUNNER_TEMP/materials-key"
          printf '%s\n' "$MATERIALS_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # Every suite. Each one runs when a path it covers changes.
          suites="cmsc-124-ps1-reference cmsc-124-ps2-reference cmsc-124-ps3-reference cmsc-124-ps4-reference cmsc-125-ps1-reference cmsc-125-ps2-reference cmsc-125-ps3-reference cmsc-125-ps4-reference cmsc-125-os-macos cmsc-125-os-linux cmsc-125-os-windows cmsc-125-bootcamp-reference cmsc-127-lab-reference cmsc-127-platform-validation cmsc-127-bootcamp-reference cmsc-197-gdd-platform-validation"

          # The materials paths each suite covers: its manuals, its bundles, its
          # starter and reference folders or gitlinks, and its spec. A trailing
          # slash stands for the whole folder. The suite's own workflow file is
          # checked separately, because it lives in this repository.
          matches() {
            case "$1" in
              cmsc-124-ps1-reference)
                case "$2" in
                  "CMSC 124/Lecture/ps-data-types/"*) return 0 ;;
                esac ;;
              cmsc-124-ps2-reference)
                case "$2" in
                  "CMSC 124/Lecture/ps-r/"*) return 0 ;;
                esac ;;
              cmsc-124-ps3-reference)
                case "$2" in
                  "CMSC 124/Lecture/ps-clisp/"*) return 0 ;;
                esac ;;
              cmsc-124-ps4-reference)
                case "$2" in
                  "CMSC 124/Lecture/ps-prolog/"*) return 0 ;;
                esac ;;
              cmsc-125-ps1-reference)
                case "$2" in
                  "CMSC 125/Lecture/ps1/"*) return 0 ;;
                esac ;;
              cmsc-125-ps2-reference)
                case "$2" in
                  "CMSC 125/Lecture/ps2/"*) return 0 ;;
                esac ;;
              cmsc-125-ps3-reference)
                case "$2" in
                  "CMSC 125/Lecture/ps3/"*) return 0 ;;
                esac ;;
              cmsc-125-ps4-reference)
                case "$2" in
                  "CMSC 125/Lecture/ps4/"*) return 0 ;;
                esac ;;
              cmsc-125-os-macos|cmsc-125-os-linux|cmsc-125-os-windows)
                # The three operating-system routes share one set of inputs: the
                # starter gitlink, the reference tree, the four lab manuals, and
                # the spec.
                case "$2" in
                  "CMSC 125/Laboratory/os-starter"|\
                  "CMSC 125/Laboratory/os-reference/"*|\
                  "CMSC 125/Laboratory/lab1/"*|\
                  "CMSC 125/Laboratory/lab2/"*|\
                  "CMSC 125/Laboratory/lab3/"*|\
                  "CMSC 125/Laboratory/lab4/"*|\
                  "CMSC 125/Laboratory/spec/"*) return 0 ;;
                esac ;;
              cmsc-125-bootcamp-reference)
                case "$2" in
                  "CMSC 125/Laboratory/b1/"*|\
                  "CMSC 125/Laboratory/b2/"*|\
                  "CMSC 125/Laboratory/b3/"*|\
                  "CMSC 125/Laboratory/b4/"*|\
                  "CMSC 125/Laboratory/manifests/"*|\
                  "CMSC 125/Laboratory/make-bootcamp-bundles.sh"|\
                  "CMSC 125/Laboratory/spec/"*) return 0 ;;
                esac ;;
              cmsc-127-lab-reference)
                case "$2" in
                  "CMSC 127/Laboratory/lab1/"*|\
                  "CMSC 127/Laboratory/lab2/"*|\
                  "CMSC 127/Laboratory/lab3/"*|\
                  "CMSC 127/Laboratory/harness"|\
                  "CMSC 127/Laboratory/starter"|\
                  "CMSC 127/Laboratory/reference/"*|\
                  "CMSC 127/Laboratory/spec/"*|\
                  "CMSC 127/Laboratory/policy/"*) return 0 ;;
                esac ;;
              cmsc-127-platform-validation)
                case "$2" in
                  "CMSC 127/Laboratory/b1/"*|\
                  "CMSC 127/Laboratory/harness"|\
                  "CMSC 127/Laboratory/lab3/reference/"*|\
                  "CMSC 127/Laboratory/spec/"*) return 0 ;;
                esac ;;
              cmsc-127-bootcamp-reference)
                case "$2" in
                  "CMSC 127/Laboratory/b2/"*|\
                  "CMSC 127/Laboratory/b3/"*|\
                  "CMSC 127/Laboratory/b4/"*|\
                  "CMSC 127/Laboratory/b5/"*|\
                  "CMSC 127/Laboratory/b6/"*|\
                  "CMSC 127/Laboratory/b7/"*|\
                  "CMSC 127/Laboratory/manifests/"*|\
                  "CMSC 127/Laboratory/make-bootcamp-bundles.sh"|\
                  "CMSC 127/Laboratory/reference/bootcamp-domain/"*|\
                  "CMSC 127/Laboratory/starter"|\
                  "CMSC 127/Laboratory/spec/"*) return 0 ;;
                esac ;;
              cmsc-197-gdd-platform-validation)
                case "$2" in
                  "CMSC 197 (Game Design and Development)/Laboratory/"*|\
                  "CMSC 197 (Game Design and Development)/Tasks/reviews/editor-proof/"*|\
                  ".github/godot-editor-replay/"*|\
                  ".github/publication-validation/"*) return 0 ;;
                esac ;;
            esac
            return 1
          }

          # Read each suite's watermark from this repository's run history.
          marks="$RUNNER_TEMP/watermarks.txt"
          : > "$marks"
          for suite in $suites; do
            mark="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$suite.yml/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.status != "completed") or (.conclusion == "success"))][0].run_started_at // "none"')"
            printf '%s %s\n' "$suite" "$mark" >> "$marks"
          done
          cat "$marks"

          # Fetch the head first. A shallow-since fetch fails when the head
          # commit is older than the date, so the deepen below runs only when
          # the date is older than the head commit.
          repo="$RUNNER_TEMP/materials"
          git init --quiet "$repo"
          git -C "$repo" remote add origin git@github.com:WhiteLicorice/Ren-s-Materials.git
          git -C "$repo" fetch --quiet --no-tags --depth 1 origin master
          head="$(git -C "$repo" rev-parse FETCH_HEAD)"
          head_epoch="$(git -C "$repo" log -1 --format=%ct FETCH_HEAD)"
          echo "materials head $head"

          oldest="$(awk '$2 != "none" { print $2 }' "$marks" | sort | head -1)"
          if [ -n "$oldest" ]; then
            oldest_epoch="$(date -u -d "$oldest" +%s)"
            if [ "$oldest_epoch" -lt "$head_epoch" ]; then
              git -C "$repo" fetch --quiet --no-tags --shallow-since="$oldest" origin master
            fi
          fi

          dispatch() {
            echo "dispatch $1 at $head"
            gh workflow run "$1.yml" -R "$GITHUB_REPOSITORY" -f ref="$head"
          }

          while read -r suite mark; do
            if [ "$mark" = "none" ]; then
              dispatch "$suite"
              continue
            fi

            # The suite's own workflow file lives here, so a change to it is
            # read from this repository's history.
            if [ -n "$(git -C staging log --since="$mark" --format=%H -- ".github/workflows/$suite.yml")" ]; then
              dispatch "$suite"
              continue
            fi

            base="$(git -C "$repo" rev-list -1 --before="$mark" FETCH_HEAD || true)"
            if [ -z "$base" ]; then
              dispatch "$suite"
              continue
            fi
            if [ "$base" = "$head" ]; then
              echo "skip $suite, it passed on $head"
              continue
            fi
            hit=0
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if matches "$suite" "$path"; then
                hit=1
                break
              fi
            done <<< "$(git -C "$repo" diff --name-only "$base" "$head")"
            if [ "$hit" -eq 1 ]; then
              dispatch "$suite"
            else
              echo "skip $suite, no watched path changed"
            fi
          done < "$marks"
