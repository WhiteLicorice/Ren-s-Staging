# Probe. This workflow answers one question: can a hosted Windows runner run
# WSL2 Ubuntu? It is deleted after the answer is recorded.
#
# The CMSC 125 problem sets, bootcamps, and labs send a Windows student into
# Ubuntu under Windows Subsystem for Linux 2. The manuals print `wsl --install`
# and then run every course command inside Ubuntu. A hosted runner is a virtual
# machine, and WSL2 needs a second level of virtualization, so the answer is not
# obvious from the documentation.
name: probe-wsl2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Record the runner
        shell: pwsh
        run: |
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber, HyperVisorPresent |
            Format-List
          Write-Output "--- processor virtualization ---"
          Get-CimInstance Win32_Processor | Select-Object Name, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions | Format-List
          Write-Output "--- optional features ---"
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux, VirtualMachinePlatform |
            Select-Object FeatureName, State | Format-Table -AutoSize

      - name: Report the WSL command state before any install
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output "--- wsl --version ---"
          wsl --version
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --status ---"
          wsl --status
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --list --verbose ---"
          wsl --list --verbose
          Write-Output "exit=$LASTEXITCODE"

      - name: Install WSL and Ubuntu
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output "--- wsl --install --no-distribution ---"
          wsl --install --no-distribution
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --update ---"
          wsl --update
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --install -d Ubuntu ---"
          wsl --install -d Ubuntu --no-launch
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --list --verbose ---"
          wsl --list --verbose
          Write-Output "exit=$LASTEXITCODE"

      - name: Try to start Ubuntu at version 2
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output "--- wsl --set-default-version 2 ---"
          wsl --set-default-version 2
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl -d Ubuntu -- uname -a ---"
          wsl -d Ubuntu -- uname -a
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --list --verbose ---"
          wsl --list --verbose
          Write-Output "exit=$LASTEXITCODE"

      - name: Try to start Ubuntu at version 1
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output "--- wsl --set-version Ubuntu 1 ---"
          wsl --set-version Ubuntu 1
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl -d Ubuntu -- uname -a ---"
          wsl -d Ubuntu -- uname -a
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- wsl --list --verbose ---"
          wsl --list --verbose
          Write-Output "exit=$LASTEXITCODE"

      - name: Try the course toolchain inside Ubuntu
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output "--- apt update ---"
          wsl -d Ubuntu -- bash -lc "sudo apt-get update -qq && echo apt-ok"
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- qemu-riscv32 ---"
          wsl -d Ubuntu -- bash -lc "sudo apt-get install -y -qq qemu-user >/dev/null 2>&1; command -v qemu-riscv32 || echo qemu-riscv32-absent"
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- /mnt/c reachable ---"
          wsl -d Ubuntu -- bash -lc "ls /mnt/c >/dev/null 2>&1 && echo mnt-c-ok || echo mnt-c-absent"
          Write-Output "exit=$LASTEXITCODE"

      - name: Summarise
        shell: pwsh
        run: |
          Write-Output "--- final wsl --list --verbose ---"
          wsl --list --verbose
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- final wsl --status ---"
          wsl --status
          Write-Output "exit=$LASTEXITCODE"
