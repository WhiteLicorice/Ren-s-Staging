# This workflow runs the CMSC 125 Problem Set 3 public corpus with the
# instructor reference overlaid. It expects a clean pass.
#
# The starter repository has its own workflow, and that run is red on purpose:
# the starter ships three unimplemented files, so it passes 13 of its 39 cases.
# That number says nothing about whether the assignment can be finished. This
# workflow answers that question, and it lives here because this is the only
# repository holding the solution.
#
# The suite runs in the public repository WhiteLicorice/Ren-s-Staging, so it
# spends no private Actions minutes. It checks out the private materials
# repository with a read-only deploy key.
name: cmsc-125-ps3-reference

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch of WhiteLicorice/Ren-s-Materials to test'
        required: false
        default: master
        type: string

permissions:
  contents: read

jobs:
  # The Ubuntu gate runs on demand.
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      # The starter is a submodule. Fetch only that one, because the
      # repository holds other submodules this run doesn't need.
      - name: Fetch the starter submodule
        run: git -C materials submodule update --init -- "CMSC 125/Lecture/ps3/starter"
        shell: bash

      - name: Report the tools this run grades with
        run: |
          cc --version
          make --version
          python3 --version
        shell: bash

      # verify.sh copies the starter to a temporary directory. It overlays
      # reference/src/*.c, runs the starter's own check.sh, runs the student
      # example, then runs both self-test files. Expect 39/39 cases, 1/1
      # student case, 13/13 case-checker self-tests, 3/3 invariant-checker
      # self-tests, 5/5 invariant checks, and exit 0.
      - name: Run the published checks with the solution overlaid
        run: bash "materials/CMSC 125/Lecture/ps3/reference/verify.sh"
        shell: bash

  # The macOS route from the manual runs on demand only, because a macOS
  # runner costs more than an Ubuntu runner. The semaphore module uses named
  # semaphores because macOS does not support unnamed semaphores.
  reference-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      # The starter is a submodule. Fetch only that one, because the
      # repository holds other submodules this run doesn't need.
      - name: Fetch the starter submodule
        run: git -C materials submodule update --init -- "CMSC 125/Lecture/ps3/starter"
        shell: bash

      # The macOS setup section prints xcode-select --install, brew --version,
      # and brew install python (cmsc-125-ps3.md:417, :423, :429), and it runs
      # the last two only when Python is older than 3.9. The installer is
      # interactive, so the step checks its result instead: a compiler, make,
      # Homebrew, and the Python floor the manual names. A runner carries full
      # Xcode where a student Mac carries the Command Line Tools, so the check
      # reads the tools the manual promises, not the folder they sit in.
      - name: The manual's macOS setup holds
        run: |
          xcode-select -p
          command -v clang && clang --version
          command -v make && make --version
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'
          brew --version
        shell: bash

      - name: Report the tools this run grades with
        run: |
          cc --version
          make --version
          python3 --version
        shell: bash

      # The PS3 manual prints a macOS build line for its semaphore listing
      # (cmsc-125-ps3.md:854), with -lrt left off. Run it on the listing the
      # page carries, so the printed line is what the checkout exercises. The
      # listing comes from the student-facing manual, so printing it shows no
      # reference source.
      - name: The semaphore listing builds with the manual's macOS line
        run: |
          python3 - "materials/CMSC 125/Lecture/ps3/cmsc-125-ps3.md" > semaphores.c <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          for block in re.finditer(r"```c\r?\n(.*?)```", text, re.S):
              if "open_pair(" in block.group(1):
                  sys.stdout.write(block.group(1).replace("\r\n", "\n"))
                  break
          else:
              sys.exit("the PS3 manual holds no semaphore listing")
          PY
          echo "--- semaphores.c ---"
          cat semaphores.c
          gcc -std=c11 -Wall -Wextra -pthread semaphores.c -o semaphores
          ./semaphores | tee /tmp/ps3-semaphores.txt
          grep -q 'named semaphore setup and cleanup passed' /tmp/ps3-semaphores.txt
        shell: bash

      # verify.sh copies the starter to a temporary directory. It overlays
      # reference/src/*.c, runs the starter's own check.sh, runs the student
      # example, then runs both self-test files. Expect 39/39 cases, 1/1
      # student case, 13/13 case-checker self-tests, 3/3 invariant-checker
      # self-tests, 5/5 invariant checks, and exit 0.
      - name: Run the published checks with the solution overlaid
        run: bash "materials/CMSC 125/Lecture/ps3/reference/verify.sh"
        shell: bash
