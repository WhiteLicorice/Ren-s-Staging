# This workflow runs the CMSC 125 Problem Set 3 public corpus with the
# instructor reference overlaid. It expects a clean pass.
#
# The starter repository has its own workflow, and that run is red on purpose:
# the starter ships three unimplemented files, so it passes 13 of its 39 cases.
# That number says nothing about whether the assignment can be finished. This
# workflow answers that question, and it lives here because this is the only
# repository holding the solution.
#
# The suite runs in the public repository WhiteLicorice/Ren-s-Staging, so it
# spends no private Actions minutes. It checks out the private materials
# repository with a read-only deploy key.
name: cmsc-125-ps3-reference

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch of WhiteLicorice/Ren-s-Materials to test'
        required: false
        default: master
        type: string

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      # The starter is a submodule. Fetch only that one, because the
      # repository holds other submodules this run doesn't need.
      - name: Fetch the starter submodule
        run: git -C materials submodule update --init -- "CMSC 125/Lecture/ps3/starter"
        shell: bash

      - name: Report the tools this run grades with
        run: |
          cc --version
          make --version
          python3 --version
        shell: bash

      # verify.sh copies the starter to a temporary directory. It overlays
      # reference/src/*.c, runs the starter's own check.sh, runs the student
      # example, then runs both self-test files. Expect 39/39 cases, 1/1
      # student case, 13/13 case-checker self-tests, 3/3 invariant-checker
      # self-tests, 5/5 invariant checks, and exit 0.
      - name: Run the published checks with the solution overlaid
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 125/Lecture/ps3/reference/verify.sh"
        shell: bash

  # The macOS route from the manual. It runs in the same dispatch as the
  # Ubuntu job, so one dispatch proves both native routes. The semaphore
  # module uses named semaphores because macOS does not support unnamed
  # semaphores.

      - name: Report a failure
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_REF: ${{ inputs.ref || 'master' }}
          JOB_NAME: ${{ github.job }}
          MATRIX_ENTRY: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/full-output.txt"

          # The public log prints the case names and the pass or fail results.
          # The full output stays in the file and goes to the private issue.
          if [ -f "$full" ]; then
            grep -E '^\[(PASS|FAIL)\]|^[0-9]+/[0-9]+ |^result: |^KTEST VERDICT |^  (ok|fail|warn) |^checks: |^(PASS|FAIL) |^All published checks passed|^verify\.sh: |^self-tests: pass|^shared files: in sync|^no QEMU process is left|^starter .* ok|^exported |^verify: PASS|^Lab [0-9] count|^All Lab [0-9] checks passed|^Group Lab|^[0-9]+ of [0-9]+ steps complete|^Some checks in cases failed|^the reference state imported|^CMSC197_' "$full" || true
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # Only a failure reports. The closing job at the end of this workflow
          # closes the issue, and that job waits for every other job.
          case "$JOB_STATUS" in
            failure) ;;
            *)
              echo "Job status $JOB_STATUS. This job reports no failure."
              exit 0
              ;;
          esac

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          body="$RUNNER_TEMP/issue-body.txt"
          {
            printf 'Run: %s\n' "$RUN_URL"
            printf 'Tested ref: %s\n' "$TESTED_REF"
            printf 'Job: %s\n' "$JOB_NAME"
            printf 'Matrix: %s\n' "$MATRIX_ENTRY"
            printf '\n'
          } > "$body"
          budget=$(( 60000 - $(wc -c < "$body") ))
          if [ -f "$full" ]; then
            tail -c "$budget" "$full" >> "$body"
          fi

          numbers="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number")"
          number="$(printf '%s\n' "$numbers" | sed -n '1p')"

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$repo" --body-file "$body"
            # The closing job of a run that started after this one may have
            # closed the issue between the lookup and the comment. A failure
            # must leave the issue open.
            state="$(gh api "repos/$repo/issues/$number" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$number" -R "$repo"
            fi
            exit 0
          fi

          # Two jobs of one run can fail at the same moment. Both find no open
          # issue and both create one, so the later one folds its report into
          # the lowest-numbered issue and closes the issue it created.
          created="$(gh issue create -R "$repo" --title "$title" --body-file "$body")"
          created="${created##*/}"
          keep="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sort -n | sed -n '1p')"
          if [ -n "$keep" ] && [ "$keep" != "$created" ]; then
            gh issue comment "$keep" -R "$repo" --body-file "$body"
            # A closing job may have closed the kept issue in the same
            # moment. The failure must leave it open.
            state="$(gh api "repos/$repo/issues/$keep" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$keep" -R "$repo"
            fi
            gh issue close "$created" -R "$repo" \
              --comment "Duplicate of #$keep for the same run." || true
          fi

  # The manual's Windows route runs Ubuntu inside Windows Subsystem for Linux 2
  # and then runs every course command inside it. This job follows that route on
  # a hosted Windows runner. Probe run 44644114479 proved that WSL2 starts
  # there, that `uname -r` reports the WSL2 kernel, and that `qemu-riscv32`
  # installs and runs inside the distribution.
  reference-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch the starter submodule
        shell: bash
        run: git -C materials submodule update --init -- "CMSC 125/Lecture/ps3/starter"

      # The manual prints `wsl --install -d Ubuntu` and names Ubuntu 24.04. The
      # `Ubuntu` name now installs 26.04, where the manual's apt line fails
      # because `qemu-system-riscv32` has no installation candidate, so this job
      # asks for `Ubuntu-24.04` by name.
      - name: Install Ubuntu under WSL2
        run: |
          wsl --install --no-distribution
          wsl --update
          wsl --install -d Ubuntu-24.04 --no-launch
          wsl --set-default-version 2
          wsl -d Ubuntu-24.04 -- bash -lc 'uname -a'
          $kernel = (wsl -d Ubuntu-24.04 -- bash -lc 'uname -r').Trim()
          Write-Output "kernel: $kernel"
          if ($kernel -notmatch 'WSL2') { throw "Ubuntu did not start at version 2: $kernel" }

      - name: Install the toolchain inside Ubuntu
        run: |
          wsl -d Ubuntu-24.04 -- bash -lc 'sudo apt-get update && sudo apt-get install -y build-essential python3 make'
          wsl -d Ubuntu-24.04 -- bash -lc 'cc --version | head -1; make --version | head -1; python3 --version'

      - name: Run the published checks with the solution overlaid
        run: |
          $script = @'
          set -euo pipefail
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 125/Lecture/ps3/reference/verify.sh"
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/step.sh", ($script -replace "`r`n", "`n"))
          # wsl.exe drops the backslashes from a Windows path, so wslpath gets
          # a forward-slash path instead.
          $posixScript = (wsl -d Ubuntu-24.04 -- wslpath -a ("$env:RUNNER_TEMP/step.sh" -replace '\\', '/')).Trim()
          $posixWorkspace = (wsl -d Ubuntu-24.04 -- wslpath -a ("$env:GITHUB_WORKSPACE" -replace '\\', '/')).Trim()
          $posixTemp = (wsl -d Ubuntu-24.04 -- wslpath -a ("$env:RUNNER_TEMP" -replace '\\', '/')).Trim()
          wsl -d Ubuntu-24.04 -- bash -lc "export GITHUB_WORKSPACE='$posixWorkspace' RUNNER_TEMP='$posixTemp'; cd '$posixWorkspace'; bash '$posixScript'"
          exit $LASTEXITCODE

      - name: Report a failure
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_REF: ${{ inputs.ref || 'master' }}
          JOB_NAME: ${{ github.job }}
          MATRIX_ENTRY: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/full-output.txt"

          # The public log prints the case names and the pass or fail results.
          # The full output stays in the file and goes to the private issue.
          if [ -f "$full" ]; then
            grep -E '^\[(PASS|FAIL)\]|^[0-9]+/[0-9]+ |^result: |^KTEST VERDICT |^  (ok|fail|warn) |^checks: |^(PASS|FAIL) |^All published checks passed|^verify\.sh: |^self-tests: pass|^shared files: in sync|^no QEMU process is left|^starter .* ok|^exported |^verify: PASS|^Lab [0-9] count|^All Lab [0-9] checks passed|^Group Lab|^[0-9]+ of [0-9]+ steps complete|^Some checks in cases failed|^the reference state imported|^CMSC197_' "$full" || true
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # Only a failure reports. The closing job at the end of this workflow
          # closes the issue, and that job waits for every other job.
          case "$JOB_STATUS" in
            failure) ;;
            *)
              echo "Job status $JOB_STATUS. This job reports no failure."
              exit 0
              ;;
          esac

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          body="$RUNNER_TEMP/issue-body.txt"
          {
            printf 'Run: %s\n' "$RUN_URL"
            printf 'Tested ref: %s\n' "$TESTED_REF"
            printf 'Job: %s\n' "$JOB_NAME"
            printf 'Matrix: %s\n' "$MATRIX_ENTRY"
            printf '\n'
          } > "$body"
          budget=$(( 60000 - $(wc -c < "$body") ))
          if [ -f "$full" ]; then
            tail -c "$budget" "$full" >> "$body"
          fi

          numbers="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number")"
          number="$(printf '%s\n' "$numbers" | sed -n '1p')"

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$repo" --body-file "$body"
            # The closing job of a run that started after this one may have
            # closed the issue between the lookup and the comment. A failure
            # must leave the issue open.
            state="$(gh api "repos/$repo/issues/$number" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$number" -R "$repo"
            fi
            exit 0
          fi

          # Two jobs of one run can fail at the same moment. Both find no open
          # issue and both create one, so the later one folds its report into
          # the lowest-numbered issue and closes the issue it created.
          created="$(gh issue create -R "$repo" --title "$title" --body-file "$body")"
          created="${created##*/}"
          keep="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sort -n | sed -n '1p')"
          if [ -n "$keep" ] && [ "$keep" != "$created" ]; then
            gh issue comment "$keep" -R "$repo" --body-file "$body"
            # A closing job may have closed the kept issue in the same
            # moment. The failure must leave it open.
            state="$(gh api "repos/$repo/issues/$keep" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$keep" -R "$repo"
            fi
            gh issue close "$created" -R "$repo" \
              --comment "Duplicate of #$keep for the same run." || true
          fi
  # The macOS route from the manual. It runs in the same dispatch as the
  # Ubuntu job, so one dispatch proves both native routes.

  reference-macos:
    runs-on: macos-latest
    steps:
      - name: Check out the materials repository
        uses: actions/checkout@v7
        with:
          repository: WhiteLicorice/Ren-s-Materials
          ssh-key: ${{ secrets.MATERIALS_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'master' }}
          path: materials
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      # The starter is a submodule. Fetch only that one, because the
      # repository holds other submodules this run doesn't need.
      - name: Fetch the starter submodule
        run: git -C materials submodule update --init -- "CMSC 125/Lecture/ps3/starter"
        shell: bash

      # The macOS setup section prints xcode-select --install, brew --version,
      # and brew install python (cmsc-125-ps3.md:417, :423, :429), and it runs
      # the last two only when Python is older than 3.9. The installer is
      # interactive, so the step checks its result instead: a compiler, make,
      # Homebrew, and the Python floor the manual names. A runner carries full
      # Xcode where a student Mac carries the Command Line Tools, so the check
      # reads the tools the manual promises, not the folder they sit in.
      - name: The manual's macOS setup holds
        run: |
          xcode-select -p
          command -v clang && clang --version
          command -v make && make --version
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'
          brew --version
        shell: bash

      - name: Report the tools this run grades with
        run: |
          cc --version
          make --version
          python3 --version
        shell: bash

      # The PS3 manual prints a macOS build line for its semaphore listing
      # (cmsc-125-ps3.md:854), with -lrt left off. Run it on the listing the
      # page carries, so the printed line is what the checkout exercises. The
      # listing comes from the student-facing manual, so printing it shows no
      # reference source.
      - name: The semaphore listing builds with the manual's macOS line
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          python3 - "materials/CMSC 125/Lecture/ps3/cmsc-125-ps3.md" > semaphores.c <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          for block in re.finditer(r"```c\r?\n(.*?)```", text, re.S):
              if "open_pair(" in block.group(1):
                  sys.stdout.write(block.group(1).replace("\r\n", "\n"))
                  break
          else:
              sys.exit("the PS3 manual holds no semaphore listing")
          PY
          echo "--- semaphores.c ---"
          cat semaphores.c
          gcc -std=c11 -Wall -Wextra -pthread semaphores.c -o semaphores
          ./semaphores | tee /tmp/ps3-semaphores.txt
          grep -q 'named semaphore setup and cleanup passed' /tmp/ps3-semaphores.txt
        shell: bash

      # verify.sh copies the starter to a temporary directory. It overlays
      # reference/src/*.c, runs the starter's own check.sh, runs the student
      # example, then runs both self-test files. Expect 39/39 cases, 1/1
      # student case, 13/13 case-checker self-tests, 3/3 invariant-checker
      # self-tests, 5/5 invariant checks, and exit 0.
      - name: Run the published checks with the solution overlaid
        run: |
          exec >> "$RUNNER_TEMP/full-output.txt" 2>&1
          bash "materials/CMSC 125/Lecture/ps3/reference/verify.sh"
        shell: bash

      - name: Report a failure
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_REF: ${{ inputs.ref || 'master' }}
          JOB_NAME: ${{ github.job }}
          MATRIX_ENTRY: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          full="$RUNNER_TEMP/full-output.txt"

          # The public log prints the case names and the pass or fail results.
          # The full output stays in the file and goes to the private issue.
          if [ -f "$full" ]; then
            grep -E '^\[(PASS|FAIL)\]|^[0-9]+/[0-9]+ |^result: |^KTEST VERDICT |^  (ok|fail|warn) |^checks: |^(PASS|FAIL) |^All published checks passed|^verify\.sh: |^self-tests: pass|^shared files: in sync|^no QEMU process is left|^starter .* ok|^exported |^verify: PASS|^Lab [0-9] count|^All Lab [0-9] checks passed|^Group Lab|^[0-9]+ of [0-9]+ steps complete|^Some checks in cases failed|^the reference state imported|^CMSC197_' "$full" || true
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # Only a failure reports. The closing job at the end of this workflow
          # closes the issue, and that job waits for every other job.
          case "$JOB_STATUS" in
            failure) ;;
            *)
              echo "Job status $JOB_STATUS. This job reports no failure."
              exit 0
              ;;
          esac

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          body="$RUNNER_TEMP/issue-body.txt"
          {
            printf 'Run: %s\n' "$RUN_URL"
            printf 'Tested ref: %s\n' "$TESTED_REF"
            printf 'Job: %s\n' "$JOB_NAME"
            printf 'Matrix: %s\n' "$MATRIX_ENTRY"
            printf '\n'
          } > "$body"
          budget=$(( 60000 - $(wc -c < "$body") ))
          if [ -f "$full" ]; then
            tail -c "$budget" "$full" >> "$body"
          fi

          numbers="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number")"
          number="$(printf '%s\n' "$numbers" | sed -n '1p')"

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$repo" --body-file "$body"
            # The closing job of a run that started after this one may have
            # closed the issue between the lookup and the comment. A failure
            # must leave the issue open.
            state="$(gh api "repos/$repo/issues/$number" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$number" -R "$repo"
            fi
            exit 0
          fi

          # Two jobs of one run can fail at the same moment. Both find no open
          # issue and both create one, so the later one folds its report into
          # the lowest-numbered issue and closes the issue it created.
          created="$(gh issue create -R "$repo" --title "$title" --body-file "$body")"
          created="${created##*/}"
          keep="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sort -n | sed -n '1p')"
          if [ -n "$keep" ] && [ "$keep" != "$created" ]; then
            gh issue comment "$keep" -R "$repo" --body-file "$body"
            # A closing job may have closed the kept issue in the same
            # moment. The failure must leave it open.
            state="$(gh api "repos/$repo/issues/$keep" --jq '.state')"
            if [ "$state" = "closed" ]; then
              gh issue reopen "$keep" -R "$repo"
            fi
            gh issue close "$created" -R "$repo" \
              --comment "Duplicate of #$keep for the same run." || true
          fi

  # Every job above reports its own failure. This job closes the issue, because
  # a passing job alone does not mean the run passed: a job that fails later
  # would open the issue again. It closes only when every job succeeded or was
  # skipped. A cancelled job is not a pass, so a cancelled run closes nothing.
  report:
    needs: [reference, reference-windows, reference-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Close the issue when every job passed
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MATERIALS_ISSUES_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MATERIALS_ISSUES_TOKEN is empty. The issue report is skipped."
            exit 0
          fi

          # A skipped job is fine. Every other result, including a cancelled
          # job, keeps the issue open.
          verdict="$(printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          results = [job["result"] for job in json.load(sys.stdin).values()]
          print("pass" if all(r in ("success", "skipped") for r in results) else "hold")
          ')"
          if [ "$verdict" != "pass" ]; then
            echo "A job did not pass. The issue stays open."
            exit 0
          fi

          repo=WhiteLicorice/Ren-s-Materials
          title="CI: $WORKFLOW_NAME failed"
          number="$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | sed -n '1p')"
          if [ -z "$number" ]; then
            echo "No open issue to close."
            exit 0
          fi
          gh issue close "$number" -R "$repo" --comment "Passing run: $RUN_URL"
